<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hachetv IPTV Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            background-color: #0a0e14;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 15px;
        }
        h1 { font-size: 1.4rem; text-align: center; color: #bc34fa; text-shadow: 0 0 10px #bc34fa; margin-bottom: 5px; }
        .subtitle { text-align: center; font-size: 0.8rem; color: #00f0ff; margin-bottom: 20px; font-family: monospace; }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .card {
            background-color: #101520;
            border: 1px solid #1f293d;
            border-radius: 12px;
            overflow: hidden;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:active { transform: scale(0.95); }
        .card img { width: 100%; height: auto; display: block; background: #1a1f2c; }
        .card-title { padding: 8px; font-size: 0.85rem; font-weight: bold; }
        video {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            background: #000;
        }
        #status-text {
            text-align: center;
            font-family: monospace;
            font-size: 0.85rem;
            color: #00f0ff;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <h1>🍿 HACHETV STREAM</h1>
    <div class="subtitle">[ MINI APP REPRODUCTOR ]</div>
    
    <div id="status-text">⚡ Conectando al nodo de transmisión de Hugging Face...</div>

    <!-- Reproductor de Video principal -->
    <video id="video-player" controls></video>

    <!-- Grid de Películas -->
    <div id="catalog-grid" class="grid"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Enlace de streaming en crudo (RAW) directo desde tu dataset de Hugging Face (Sin CORS y libre de Adblockers)
        const playlistUrl = "https://huggingface.co/datasets/Hachetv/BOTtelegram/raw/main/peliculas_archive.m3u";
        
        const grid = document.getElementById("catalog-grid");
        const player = document.getElementById("video-player");
        const statusText = document.getElementById("status-text");

        async function loadIPTV() {
            try {
                // Descarga directa sin intermediarios ni proxies
                const response = await fetch(playlistUrl);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const text = await response.text();
                if (!text.includes("#EXTM3U")) throw new Error("Formato inválido.");

                const lines = text.split("\n");
                grid.innerHTML = "";
                
                let currentItem = null;
                let count = 0;
                
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line.startsWith("#EXTINF:")) {
                        const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                        const logo = logoMatch ? logoMatch[1] : "https://via.placeholder.com/500x750?text=Sin+Portada";
                        
                        const commaIndex = line.lastIndexOf(",");
                        const title = commaIndex !== -1 ? line.substring(commaIndex + 1) : "Película";
                        
                        currentItem = { title, logo };
                    } else if (line.startsWith("http") && currentItem !== null) {
                        currentItem.url = line;
                        createMovieCard(currentItem);
                        count++;
                        currentItem = null;
                    }
                }

                statusText.innerHTML = `🟢 <b>Streaming Activo:</b> ${count} películas sincronizadas.`;

            } catch (err) {
                statusText.innerHTML = `❌ <b>Error de sintonización:</b> No se pudo leer la lista en Hugging Face.<br>Asegúrate de que el bot v39 ya haya subido el archivo.`;
            }
        }

        function createMovieCard(movie) {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <img src="${movie.logo}" alt="${movie.title}">
                <div class="card-title">${movie.title}</div>
            `;
            card.onclick = () => playMovie(movie.url);
            grid.appendChild(card);
        }

        function playMovie(url) {
            player.style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (Hls.isSupported() && (url.endsWith(".m3u8") || url.includes("m3u8"))) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(player);
                hls.on(Hls.Events.MANIFEST_PARSED, () => player.play());
            } else {
                player.src = url;
                player.play();
            }
        }

        loadIPTV();
    </script>
</body>
</html>
