<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hachetv IPTV Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            background-color: #0a0e14;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 15px;
        }
        h1 { font-size: 1.4rem; text-align: center; color: #bc34fa; text-shadow: 0 0 10px #bc34fa; margin-bottom: 5px; }
        .subtitle { text-align: center; font-size: 0.8rem; color: #00f0ff; margin-bottom: 20px; font-family: monospace; }
        
        /* Contenedor de Controles de Importación */
        .controls-container {
            background: #111625;
            border: 1px solid #1f293d;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        .info-text {
            font-size: 0.8rem;
            color: #8892b0;
            margin-bottom: 12px;
            line-height: 1.3;
        }
        .btn {
            background: linear-gradient(135deg, #bc34fa, #00f0ff);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            display: inline-block;
        }
        .btn:active { transform: scale(0.95); }
        .btn-secondary {
            background: #21263d;
            border: 1px solid #30365d;
            color: #00f0ff;
            font-size: 0.75rem;
            padding: 6px 12px;
            margin-top: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .card {
            background-color: #101520;
            border: 1px solid #1f293d;
            border-radius: 12px;
            overflow: hidden;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:active { transform: scale(0.95); }
        .card img { width: 100%; height: auto; display: block; background: #1a1f2c; }
        .card-title { padding: 8px; font-size: 0.85rem; font-weight: bold; }
        
        video {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            background: #000;
        }
        #debug-box {
            background-color: #2c1515;
            border: 1px solid #ff4444;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            font-family: monospace;
            font-size: 0.8rem;
            color: #ff9999;
            display: none;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <h1>🍿 HACHETV STREAM</h1>
    <div class="subtitle">[ MINI APP REPRODUCTOR ]</div>
    
    <!-- Caja de depuración en pantalla -->
    <div id="debug-box"></div>

    <!-- Reproductor de Video principal -->
    <video id="video-player" controls></video>

    <!-- Panel de Control Inteligente -->
    <div class="controls-container">
        <div class="info-text" id="status-desc">
            Intentando conectar con Internet Archive en segundo plano...
        </div>
        
        <!-- Botón para importar localmente el archivo M3U -->
        <label class="btn" style="display: inline-block;">
            📂 Importar peliculas_archive.m3u
            <input type="file" id="file-input" accept=".m3u" style="display: none;">
        </label>
        
        <br>
        <button class="btn btn-secondary" id="btn-clear" style="display: none;" onclick="clearSavedM3u()">
            🗑️ Limpiar Caché / Actualizar Catálogo
        </button>
    </div>

    <!-- Grid de Películas -->
    <div id="catalog-grid" class="grid">
        <p id="loading-text" style="grid-column: span 2; text-align: center; font-family: monospace; color: #8892b0;">
            ⚡ Buscando películas...
        </p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const rawM3uUrl = "https://ia801802.us.archive.org/31/items/hachetv-peliculas/peliculas_archive.m3u";
        
        // Proxies de contingencia
        const proxyList = [
            (url) => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(url),
            (url) => "https://corsproxy.io/?" + encodeURIComponent(url),
            (url) => "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
            (url) => url
        ];

        const grid = document.getElementById("catalog-grid");
        const player = document.getElementById("video-player");
        const debugBox = document.getElementById("debug-box");
        const statusDesc = document.getElementById("status-desc");
        const btnClear = document.getElementById("btn-clear");
        const fileInput = document.getElementById("file-input");

        // Escucha si el usuario sube su archivo M3U de forma manual
        fileInput.addEventListener("change", function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const content = evt.target.result;
                if (content.includes("#EXTM3U")) {
                    // Guardar en almacenamiento interno
                    localStorage.setItem("hachetv_saved_m3u", content);
                    debugBox.style.display = "none";
                    processM3uText(content, "Importado Localmente ✓");
                } else {
                    alert("Error: El archivo seleccionado no es un formato M3U válido.");
                }
            };
            reader.readAsText(file);
        });

        // Borra la lista guardada para forzar una nueva recarga
        function clearSavedM3u() {
            localStorage.removeItem("hachetv_saved_m3u");
            location.reload();
        }

        // Descarga automática desde la nube usando Fallbacks
        async function fetchPlaylistWithFallback() {
            for (let i = 0; i < proxyList.length; i++) {
                const targetUrl = proxyList[i](rawM3uUrl);
                try {
                    const response = await fetch(targetUrl);
                    if (response.ok) {
                        const text = await response.text();
                        if (text && text.includes("#EXTM3U")) return text;
                    }
                } catch (err) {
                    console.warn(`Nodo ${i+1} bloqueado.`);
                }
            }
            throw new Error("No se pudo conectar automáticamente debido a un AdBlocker o restricciones de red.");
        }

        // Procesa el texto plano del M3U y dibuja el catálogo en pantalla
        function processM3uText(text, sourceLabel) {
            const lines = text.split("\n");
            grid.innerHTML = "";
            
            let currentItem = null;
            let count = 0;
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith("#EXTINF:")) {
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                    const logo = logoMatch ? logoMatch[1] : "https://via.placeholder.com/500x750?text=Sin+Portada";
                    
                    const commaIndex = line.lastIndexOf(",");
                    const title = commaIndex !== -1 ? line.substring(commaIndex + 1) : "Película sin título";
                    
                    currentItem = { title, logo };
                } else if (line.startsWith("http") && currentItem !== null) {
                    currentItem.url = line;
                    createMovieCard(currentItem);
                    count++;
                    currentItem = null;
                }
            }

            if (count > 0) {
                statusDesc.innerHTML = `🟢 <b>Catálogo activo:</b> ${count} películas (${sourceLabel})`;
                btnClear.style.display = "inline-block";
            } else {
                grid.innerHTML = `<p style="grid-column: span 2; text-align: center; color: #ffcc00;">⚠️ Lista M3U vacía.</p>`;
            }
        }

        function createMovieCard(movie) {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <img src="${movie.logo}" alt="${movie.title}">
                <div class="card-title">${movie.title}</div>
            `;
            card.onclick = () => playMovie(movie.url);
            grid.appendChild(card);
        }

        function playMovie(url) {
            player.style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (Hls.isSupported() && (url.endsWith(".m3u8") || url.includes("m3u8"))) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(player);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    player.play();
                });
            } else {
                player.src = url;
                player.play();
            }
        }

        // Lógica de arranque de la aplicación
        async function initApp() {
            // 1. ¿Hay una lista guardada en la memoria local del navegador?
            const savedData = localStorage.getItem("hachetv_saved_m3u");
            if (savedData) {
                processM3uText(savedData, "Cargado de Memoria Interna ✓");
                return;
            }

            // 2. Si no hay memoria, intenta cargar desde la nube automáticamente
            try {
                const cloudText = await fetchPlaylistWithFallback();
                processM3uText(cloudText, "Sincronizado con la Nube ✓");
            } catch (err) {
                // 3. Si todo falla, invita al usuario a importar el archivo
                document.getElementById("loading-text").style.display = "none";
                statusDesc.innerHTML = `⚠️ <b>Bloqueo de red detectado:</b> Tu adblocker o firewall impide la conexión automática.<br>👉 Descarga el archivo <code>peliculas_archive.m3u</code> de Telegram y súbelo aquí abajo:`;
            }
        }

        initApp();
    </script>
</body>
</html>
