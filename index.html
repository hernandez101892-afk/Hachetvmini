<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hachetv IPTV Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            background-color: #0a0e14;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 15px;
        }
        h1 { font-size: 1.4rem; text-align: center; color: #bc34fa; text-shadow: 0 0 10px #bc34fa; margin-bottom: 5px; }
        .subtitle { text-align: center; font-size: 0.8rem; color: #00f0ff; margin-bottom: 20px; font-family: monospace; }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .card {
            background-color: #101520;
            border: 1px solid #1f293d;
            border-radius: 12px;
            overflow: hidden;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:active {
            transform: scale(0.95);
        }
        .card img { width: 100%; height: auto; display: block; background: #1a1f2c; }
        .card-title { padding: 8px; font-size: 0.85rem; font-weight: bold; }
        video {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            background: #000;
        }
        #debug-box {
            background-color: #2c1515;
            border: 1px solid #ff4444;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
            font-family: monospace;
            font-size: 0.8rem;
            color: #ff9999;
            display: none;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <h1>🍿 HACHETV STREAM</h1>
    <div class="subtitle">[ MINI APP REPRODUCTOR ]</div>
    
    <!-- Caja de depuración en pantalla -->
    <div id="debug-box"></div>

    <!-- Reproductor de Video principal -->
    <video id="video-player" controls></video>

    <!-- Grid de Películas -->
    <div id="catalog-grid" class="grid">
        <p id="loading-text" style="grid-column: span 2; text-align: center; font-family: monospace; color: #8892b0;">
            ⚡ Conectando de forma segura con Internet Archive...
        </p>
    </div>

    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            const debugBox = document.getElementById("debug-box");
            debugBox.style.display = "block";
            debugBox.innerHTML = `🚨 <b>Error de código:</b> ${message}<br>En línea: ${lineno}`;
            return false;
        };

        const tg = window.Telegram.WebApp;
        tg.expand();

        // Enlace físico directo a tu archivo M3U en Internet Archive
        const rawM3uUrl = "https://ia801802.us.archive.org/31/items/hachetv-peliculas/peliculas_archive.m3u";
        
        // Lista de proxies de contingencia para evadir CORS y bloqueos de seguridad de forma automatizada
        const proxyList = [
            (url) => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(url),
            (url) => "https://corsproxy.io/?" + encodeURIComponent(url),
            (url) => "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
            (url) => url // Intento directo final
        ];

        const grid = document.getElementById("catalog-grid");
        const player = document.getElementById("video-player");
        const debugBox = document.getElementById("debug-box");

        // Intenta descargar el catálogo recorriendo los proxies de seguridad uno por uno
        async function fetchPlaylistWithFallback() {
            let lastError = null;
            
            for (let i = 0; i < proxyList.length; i++) {
                const proxyFn = proxyList[i];
                const targetUrl = proxyFn(rawM3uUrl);
                console.log(`Intentando conectar mediante nodo de seguridad ${i + 1}...`);
                
                try {
                    const response = await fetch(targetUrl);
                    if (response.ok) {
                        const text = await response.text();
                        if (text && text.includes("#EXTM3U")) {
                            console.log(`¡Conectado con éxito a través del nodo ${i + 1}!`);
                            return text;
                        }
                    }
                    throw new Error(`HTTP ${response.status}`);
                } catch (err) {
                    console.warn(`Nodo de seguridad ${i + 1} bloqueado o inactivo:`, err.message);
                    lastError = err;
                }
            }
            throw new Error("Todos los nodos de seguridad HTTPS para evadir el bloqueo del navegador han fallado.");
        }

        async function loadIPTV() {
            try {
                const text = await fetchPlaylistWithFallback();
                const lines = text.split("\n");
                grid.innerHTML = ""; // Quitar el texto de cargando
                
                let currentItem = null;
                let count = 0;
                
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line.startsWith("#EXTINF:")) {
                        const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                        const logo = (logoMatch && logoMatch[1]) ? logoMatch[1] : "https://via.placeholder.com/500x750?text=Sin+Portada";
                        
                        const commaIndex = line.lastIndexOf(",");
                        const title = commaIndex !== -1 ? line.substring(commaIndex + 1) : "Película sin título";
                        
                        currentItem = { title, logo };
                    } else if (line.startsWith("http") && currentItem !== null) {
                        currentItem.url = line;
                        createMovieCard(currentItem);
                        count++;
                        currentItem = null;
                    }
                }

                if (count === 0) {
                    grid.innerHTML = `<p style="grid-column: span 2; text-align: center; color: #ffcc00; font-family: monospace;">⚠️ Tu lista M3U está vacía en Archive o no tiene películas asociadas.</p>`;
                }

            } catch (err) {
                debugBox.style.display = "block";
                debugBox.innerHTML = `❌ <b>Fallo al cargar catálogo:</b> ${err.message}<br><br>💡 Los firewalls de red están bloqueando el acceso CORS. Recarga la página con <b>Ctrl + F5</b> en Edge para reintentar la conexión.`;
                document.getElementById("loading-text").innerText = "Fallo en la conexión.";
            }
        }

        function createMovieCard(movie) {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <img src="${movie.logo}" alt="${movie.title}">
                <div class="card-title">${movie.title}</div>
            `;
            card.onclick = () => playMovie(movie.url);
            grid.appendChild(card);
        }

        function playMovie(url) {
            player.style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (Hls.isSupported() && (url.endsWith(".m3u8") || url.includes("m3u8"))) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(player);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    player.play();
                });
            } else {
                player.src = url;
                player.play();
            }
        }

        loadIPTV();
    </script>
</body>
</html>
